name: "김근하"
name_latin: "KUNHA KIM"
eyebrow: "Historian · Digital Humanities"

# 첫 화면의 한 줄 소개. <b>…</b> 로 감싼 부분이 민트색으로 강조됩니다.
tagline: "조선시대 <b>군역 제도</b>를 디지털역사학의 방법론으로 연구합니다.
  국가가 백성을 동원하는 방식과 그 장기적 변화를 다룹니다."

# 현재 소속 — 줄마다 - 로 시작합니다.
affiliations:
  - "국립부경대학교 해양인문학연구소 전임연구원"
  - "서강대학교 · 고려대학교 강사"

# 소개 페이지 본문 — 문단마다 - 로 시작합니다.
about:
  - "국가는 무슨 근거로 백성에게 세금을 걷고 군대에 복무시키는가. 국가가 백성을 동원하는
    매커니즘은 장기적으로 어떻게 변화했는가. 이런 문제의식을 탐구하기 위해 조선시대 군역 제도를
    연구합니다."
  - "최근에는 디지털인문학의 방법론을 적극 도입해 HGIS, 통계 분석, 텍스트 마이닝, 네트워크 분석
    등을 결합하여 역사 데이터를 시각적으로 설명하고, 새로운 역사 해석의 가능성을 탐구합니다."
  - "연구와 함께 강의를 진행합니다. 학생들이 스스로 역사적 질문을 세우고 디지털 도구로 답을
    찾아가는 과정을 중요하게 생각하며, 그 결과물을 공개하고 있습니다."

