# ── 진행 중인 연구 ─────────────────────────────────────────
projects:
  - title: "조선 후기 조청관계 연구"
    question: "조선 후기 조선과 청의 관계는 진정한 독립성이 있었을까?"
    body: "인조부터 숙종대까지의 조–청 간 주요 외교 사건을 검토하여, 청이 조선을 정치적으로
      예속시키기보다 외교적으로 통제하는 독특한 종속 구조를 형성했음을 밝힙니다.
      외교문서와 사료를 종합 분석하여 조선의 대응 논리를 추적하고, '실질적 복속과 형식적 자율'이라는
      이중성을 탐색합니다."

  - title: "조선 전기 군역의 대립 문제 연구"
    question: "군대를 대신 가는 대립(代立)은 과연 부정적인 현상이었을까?"
    body: "14~17세기까지 300여 년에 걸친 군역 제도의 변화 과정을 추적해, 대립이 단순한 제도의
      부패가 아니라 군역의 조세화와 국가 재정 구조 전환의 일환이었음을 제시합니다.
      사회경제사적 접근과 정량 분석을 결합합니다."

  - title: "조선 시대 군역의 형평성 연구"
    question: "조선의 군역제도는 과연 공평했을까?"
    body: "『세종실록지리지』에 수록된 인구와 군사 데이터의 상관관계를 통계적으로 분석하여,
      조선 전기의 군역 동원이 인구·지리·행정 단위별로 얼마나 균형적으로 이루어졌는지를
      계량적으로 검증합니다."

  - title: "한국사연구휘보 연구"
    question: "한국 역사학계를 멀리서 보면(Distant Reading) 어떻게 보일까?"
    body: "『한국사연구휘보』의 서지 데이터를 기반으로 텍스트마이닝, GIS, 사회연결망 분석(SNA)을
      결합하여 한국 역사학계의 주제 변화와 연구자·학술지·연구기관의 관계망을 탐색합니다."
