intro: "학생들이 스스로 역사적 질문을 세우고 디지털 도구로 답을 찾아가는 과정을 중요하게 생각합니다.
  수업에서 나온 학생 작품은 동의를 받아 공개하고 있습니다."

blurb: "네 개 수업에서 나온 학술포스터와 결과물 35편을 모아 두었습니다.
  포스터를 클릭하면 크게 볼 수 있으며, 저작권은 각 제작 학생에게 있습니다."

